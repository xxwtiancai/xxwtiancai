  <text x="64" y="157" fill="#a9c5d2" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="1">BUILDING · RESEARCHING · SHARING</text>
  <text x="64" y="211" fill="#83c9c8" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing=".4">AI AGENTS   /   MACHINE LEARNING   /   VIDEO CODING</text>
